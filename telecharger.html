<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yolicards — Télécharger l'application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.dlbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:15.5px;font-weight:700;font-family:inherit;text-decoration:none;margin:8px 0}
.dlbtn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.os-note{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0}
.wait{background:var(--gold-wash);border-left:4px solid var(--gold);border-radius:12px;padding:16px;color:var(--gold-deep);font-size:14px;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1816" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg></span>Yolicards · Test</div>
    <h1>Télécharger l'application</h1>
    <p>Installez Yolicards sur votre téléphone, puis continuez votre parcours de test.</p>
  </header>

  <div id="app"></div>

  <p class="footnote">© Yolicards — Yolibrand, Abidjan.</p>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var CFG = window.YOLI_CONFIG || {};
  var app = document.getElementById("app");

  function qs(n){ try{ return new URLSearchParams(location.search).get(n)||""; }catch(e){ return ""; } }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  var code = (qs("code")||"").trim().toUpperCase();
  var base = location.href.split("/").slice(0,-1).join("/");
  var lienSuivi = base + "/suivi.html" + (code ? ("?code="+encodeURIComponent(code)) : "");

  // détection OS
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  var isAndroid = /Android/.test(ua);

  var android = (CFG.URL_ANDROID||"").trim();
  var ios = (CFG.URL_IOS||"").trim();
  var dispo = android || ios;

  if (!dispo) {
    // distribution pas encore prête
    app.innerHTML =
      '<div class="section">'+
      '<div class="wait">L\'accès à l\'application sera disponible <strong>très bientôt</strong>. '+
      'Vous recevrez un e-mail dès qu\'elle sera téléchargeable, avec le lien pour continuer votre parcours. '+
      'Merci de votre patience — rien d\'autre à faire pour l\'instant.</div>'+
      (code ? '<p class="os-note" style="margin-top:14px">Votre code testeur : <strong>'+esc(code)+'</strong></p>' : '')+
      '</div>';
    return;
  }

  // boutons selon l'OS détecté (le bon en premier, l'autre en secondaire)
  var btnA = android ? '<a class="dlbtn" href="'+esc(android)+'">'+iconA()+' Télécharger pour Android</a>' : '';
  var btnI = ios ? '<a class="dlbtn'+(isIOS?'':' alt')+'" href="'+esc(ios)+'">'+iconI()+' Télécharger pour iPhone (iOS)</a>' : '';
  // réordonne : OS détecté en premier
  var ordre = isIOS ? (btnI+btnA) : (btnA+btnI);
  if (android && ios) {
    btnA = '<a class="dlbtn'+((!isIOS)?'':' alt')+'" href="'+esc(android)+'">'+iconA()+' Télécharger pour Android</a>';
    btnI = '<a class="dlbtn'+(isIOS?'':' alt')+'" href="'+esc(ios)+'">'+iconI()+' Télécharger pour iPhone (iOS)</a>';
    ordre = isIOS ? (btnI+btnA) : (btnA+btnI);
  } else {
    ordre = btnA + btnI; // un seul dispo
  }

  app.innerHTML =
    '<div class="section">'+
    '<h2><span class="idx">1</span>Installez l\'application</h2>'+
    '<p class="lead">'+(isIOS?'Nous avons détecté un iPhone.':isAndroid?'Nous avons détecté un téléphone Android.':'Choisissez votre type de téléphone.')+'</p>'+
    ordre +
    (android&&ios ? '<p class="os-note">Mauvais bouton ? Choisissez l\'autre selon votre téléphone.</p>' : '')+
    '</div>'+
    '<div class="section">'+
    '<h2><span class="idx">2</span>Continuez votre parcours</h2>'+
    '<p class="lead">Une fois l\'app installée et votre compte créé, reprenez votre fiche de mission des 14 jours.</p>'+
    '<a class="dlbtn" href="'+esc(lienSuivi)+'">Ouvrir ma fiche de mission</a>'+
    (code ? '<p class="os-note" style="margin-top:10px">Votre code testeur : <strong>'+esc(code)+'</strong></p>' : '')+
    '</div>';

  function iconA(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18a.4.4 0 00-.69-.4l-1.86 3.23a11.3 11.3 0 00-8.78 0L6.25 5.9a.4.4 0 00-.69.4L7.4 9.48A10.8 10.8 0 002 18h20a10.8 10.8 0 00-5.4-8.52zM7.5 15.2a1 1 0 110-2 1 1 0 010 2zm9 0a1 1 0 110-2 1 1 0 010 2z"/></svg>'; }
  function iconI(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.3 12.9c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.7-.8-1.4 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.5 2 1 0 1.3-.6 2.5-.6s1.5.6 2.6.6c1.1 0 1.8-1 2.4-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.1zM14.6 6.2c.6-.7 1-1.6.9-2.6-.8 0-1.8.5-2.4 1.2-.5.6-1 1.5-.9 2.5.9.1 1.8-.5 2.4-1.1z"/></svg>'; }
})();
</script>
</body>
</html>
